# Local development database. The API runs from your IDE / `mvn spring-boot:run`.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geoapp-db
    environment:
      POSTGRES_DB: geoapp
      POSTGRES_USER: geoapp
      POSTGRES_PASSWORD: geoapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoapp -d geoapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
